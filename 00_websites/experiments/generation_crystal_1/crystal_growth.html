const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 10000);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 1000;

const maxT = Math.max(...points.map(p => p.t));
const imgW = 1080;
const imgH = 1080;

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(points.length * 3);
const colors = new Float32Array(points.length * 3);

points.forEach((p, i) => {
    positions[i*3] = p.x - imgW/2;
    positions[i*3+1] = -(p.y - imgH/2);
    positions[i*3+2] = 0;
    colors[i*3] = 1;
    colors[i*3+1] = 1;
    colors[i*3+2] = 1;
});

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({ size: 2, vertexColors: true });
const pointCloud = new THREE.Points(geometry, material);
scene.add(pointCloud);

let currentT = 0;
const speed = 1;

function updateVisibility() {
    const visible = new Float32Array(points.length * 3);
    points.forEach((p, i) => {
        if (p.t <= currentT) {
            visible[i*3] = 1;
            visible[i*3+1] = 1;
            visible[i*3+2] = 1;
        } else {
            visible[i*3] = 0;
            visible[i*3+1] = 0;
            visible[i*3+2] = 0;
        }
    });
    geometry.attributes.color.array = visible;
    geometry.attributes.color.needsUpdate = true;
}

function animate() {
    requestAnimationFrame(animate);
    currentT += speed;
    if (currentT > maxT) currentT = 0;
    updateVisibility();
    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
